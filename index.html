<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backyard Olympics Manager v2</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --line: #dbe3ee;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --success: #059669;
      --warn-bg: #fff7d6;
      --warn-line: #ecd98b;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      background: linear-gradient(135deg, #1d4ed8, #2563eb 55%, #60a5fa);
      color: white;
      border-radius: 24px;
      padding: 26px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .hero p {
      margin: 0;
      max-width: 760px;
      line-height: 1.45;
      color: rgba(255,255,255,0.92);
    }

    /* Leaderboard at the top */
    .leaderboard {
      background: var(--primary);
      color: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Stats and Card styles */
    .stats, .card, .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .card h2, .card h3 { margin: 0 0 10px; }
    .muted { color: var(--muted); font-size: 0.94rem; }

    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    label {
      display: block;
      margin: 8px 0 6px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    input, select, button, textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid #cfd8e3;
      background: #fff;
      font: inherit;
    }

    input:focus, select:focus, textarea:focus {
      outline: 3px solid rgba(37, 99, 235, 0.14);
      border-color: #8bb3ff;
    }

    button {
      cursor: pointer;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 700;
    }

    /* Moved the Event Management Card to the bottom */
    .event-summary {
      margin-top: 20px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .event-summary h3 {
      margin-bottom: 12px;
    }

    /* Matchup Styles */
    .match-grid {
      display: grid;
      gap: 16px;
    }

    .match-box {
      background: var(--line);
      border-radius: 8px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

  </style>
</head>

<body>
  <div class="container">
    <!-- Leaderboard -->
    <div class="leaderboard">
      <h2>Leaderboard</h2>
      <p>Top performers will be displayed here as the tournament progresses.</p>
    </div>

    <!-- Event Management Summary -->
    <div class="hero">
      <h1>Backyard Olympics</h1>
      <p>Welcome to the event manager. Organize, track, and enjoy your games!</p>
    </div>

    <!-- Dynamic Stats and Content Sections (Example of Matchups and Round Info) -->
    <div class="row">
      <div class="stat">
        <div class="label">Events</div>
        <div class="value" id="statEvents">0</div>
      </div>
      <div class="stat">
        <div class="label">Participants</div>
        <div class="value" id="statParticipants">0</div>
      </div>
      <div class="stat">
        <div class="label">Tie Breakers</div>
        <div class="value" id="statTieBreakers">0</div>
      </div>
      <div class="stat">
        <div class="label">Completed</div>
        <div class="value" id="statCompleted">0</div>
      </div>
    </div>

    <!-- Event Management Summary Card moved to the bottom -->
    <div class="event-summary">
      <h3>Event Summary</h3>
      <p>Manage all your events, tie-breakers, and participants below.</p>
    </div>
    
  </div>

  <script>
    // JavaScript for dynamic functionality and event management
    const el = {
      statEvents: document.getElementById('statEvents'),
      statParticipants: document.getElementById('statParticipants'),
      statTieBreakers: document.getElementById('statTieBreakers'),
      statCompleted: document.getElementById('statCompleted')
    };

    let state = {
      events: [],
      participants: [],
      tieBreakerHierarchy: []
    };

    function generateMatchups(teams) {
      const matchups = [];
      for (let i = 0; i < teams.length; i += 2) {
        if (teams[i + 1]) {
          matchups.push({ team1: teams[i], team2: teams[i + 1] });
        }
      }
      return matchups;
    }

    function syncAll() {
      renderEvents();
      renderTieBreakerOptions();
      renderParticipants();
      renderResultEventOptions();
      renderResultInputs();
      renderStandings();
      updateStats();
    }

    function renderEvents() {
      // Logic for rendering events dynamically
    }

    function renderTieBreakerOptions() {
      // Logic for rendering tie-breakers dynamically
    }

    function renderParticipants() {
      // Logic for rendering participants dynamically
    }

    function renderResultEventOptions() {
      // Logic for event result options dynamically
    }

    function renderResultInputs() {
      // Logic for result inputs dynamically
    }

    function renderStandings() {
      // Logic for rendering the leaderboard dynamically
    }

    function updateStats() {
      el.statEvents.textContent = state.events.length;
      el.statParticipants.textContent = state.participants.length;
      el.statTieBreakers.textContent = state.tieBreakerHierarchy.length;
      const completed = state.events.filter(evt => eventHasSavedResults(evt.title)).length;
      el.statCompleted.textContent = completed;
    }

    window.removeEventById = removeEventById;
    window.removeTieBreakerById = removeTieBreakerById;
    window.removeParticipantByName = removeParticipantByName;
    window.moveTieBreaker = moveTieBreaker;

    loadFromBrowser();
    syncAll();
  </script>
</body>
</html>
